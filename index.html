<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#D4537E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小棉袄" />
    <title>小棉袄 - 宝贝成长记录</title>
    <style>
      /* PWA 启动加载动画 */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #FFF5F7 0%, #FFFBEB 100%);
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader .loader-icon {
        font-size: 3rem;
        animation: bounce 1s infinite;
      }
      #app-loader .loader-text {
        margin-top: 1rem;
        color: #D4537E;
        font-size: 1.1rem;
        font-weight: 600;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
    <script type="module" crossorigin src="/little-cotton-jacket/assets/index-B-EyjRBv.js"></script>
    <link rel="stylesheet" crossorigin href="/little-cotton-jacket/assets/index-BhAxTsFf.css">
  <link rel="manifest" href="/little-cotton-jacket/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/little-cotton-jacket/registerSW.js"></script></head>
  <body>
    <div id="app-loader">
      <div class="loader-icon">🌸</div>
      <div class="loader-text">小棉袄加载中...</div>
    </div>
    <div id="root"></div>
    <script>
      // 移除加载动画
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
