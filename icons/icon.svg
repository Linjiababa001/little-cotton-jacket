<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4537E"/>
      <stop offset="100%" style="stop-color:#EF9F27"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFE4EC"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Cherry blossom flower -->
  <g transform="translate(256, 240)">
    <!-- Petals -->
    <ellipse cx="0" cy="-80" rx="45" ry="70" fill="url(#petal)" opacity="0.95" transform="rotate(0)"/>
    <ellipse cx="0" cy="-80" rx="45" ry="70" fill="url(#petal)" opacity="0.95" transform="rotate(72)"/>
    <ellipse cx="0" cy="-80" rx="45" ry="70" fill="url(#petal)" opacity="0.95" transform="rotate(144)"/>
    <ellipse cx="0" cy="-80" rx="45" ry="70" fill="url(#petal)" opacity="0.95" transform="rotate(216)"/>
    <ellipse cx="0" cy="-80" rx="45" ry="70" fill="url(#petal)" opacity="0.95" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="30" fill="#EF9F27"/>
    <circle cx="0" cy="0" r="20" fill="#FBBF24"/>
    <!-- Stamen -->
    <circle cx="0" cy="-12" r="4" fill="#D4537E"/>
    <circle cx="11" cy="-4" r="4" fill="#D4537E"/>
    <circle cx="7" cy="10" r="4" fill="#D4537E"/>
    <circle cx="-7" cy="10" r="4" fill="#D4537E"/>
    <circle cx="-11" cy="-4" r="4" fill="#D4537E"/>
  </g>
  <!-- Leaf -->
  <path d="M 350 380 Q 380 340 420 360 Q 400 400 360 400 Z" fill="#1D9E75" opacity="0.8"/>
  <path d="M 140 380 Q 110 340 80 360 Q 100 400 140 400 Z" fill="#1D9E75" opacity="0.8"/>
</svg>
